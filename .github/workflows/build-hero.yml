name: Build permanent hero image

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-hero.yml'
      - 'assets/hero-data-*.txt'

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild hero WebP from stored chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re

          chunks=[]
          for i in range(9):
              p=Path(f'assets/hero-data-{i:02d}.txt')
              chunks.append(p.read_text())

          raw=''.join(chunks)
          clean=re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          clean=clean.rstrip('=')
          clean += '=' * ((4 - len(clean) % 4) % 4)
          data=base64.b64decode(clean, validate=False)

          out=Path('assets/saaya-approved-hero.webp')
          out.write_bytes(data)
          print('decoded bytes:', len(data))
          print('header:', data[:12])
          if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
              raise SystemExit('Decoded file is not a valid WebP container')
          PY
          file assets/saaya-approved-hero.webp

      - name: Commit permanent image
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/saaya-approved-hero.webp
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Create permanent approved hero image'
            git push
          fi
